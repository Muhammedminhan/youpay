{% load static %}
{% load i18n %}
<!-- templates/admin/widgets/slider_checkbox.html -->

<div class="slider-container">
  <input type="checkbox" class="slider" id={{widget.name}} name="{{ widget.name }}"
         {% if widget.attrs.checked%}
         checked
         {% endif %}>
  <label for={{widget.name}} class="switch round"></label>
</div>

<script>
(function($) {
    $(document).ready(function() {
        // Function to toggle the visibility and state of the guest user slider
        function toggleGuestUserSlider(widgetName, guestUserEnabledStatus) {
            var parts = widgetName.split('-');
            var id = parts[1];

            var guestUserSliderId = '#paymentmethodconfig_set-' + id + '-guest_user_enabled';
            var guestUserSliderContainer = $(guestUserSliderId).closest('.slider-container');
            var guestUserSliderCheckbox = guestUserSliderContainer.find('input[type="checkbox"]');

            if (guestUserSliderContainer.length) {
                if ($('#paymentmethodconfig_set-' + id + '-active').prop('checked')) {
                    guestUserSliderContainer.show();
                    // Check if 'guest_user_enabled' is set to 'Enable' or 'Disable'
                    if (guestUserEnabledStatus === 'Enable') {
                        guestUserSliderCheckbox.prop('checked', true).prop('disabled', false);
                    } else if (guestUserEnabledStatus === 'Disable') {
                        guestUserSliderCheckbox.prop('checked', false).prop('disabled', false);
                    } else {
                        // For 'Custom' option, enable and leave it editable
                        guestUserSliderCheckbox.prop('disabled', false);
                    }
                } else {
                    guestUserSliderCheckbox.prop('checked', false).prop('disabled', false);
                    guestUserSliderContainer.hide();
                }
            }
        }

        // Call the function for each widget on page load
        $('.slider-container').each(function() {
            var widgetName = $(this).find('input[type="checkbox"]').attr('name');
            toggleGuestUserSlider(widgetName, $('#id_guest_user_enabled').val());
        });

        // Attach an event listener to each active checkbox to update the visibility dynamically
        $(document).on('change', 'input[type="checkbox"].slider', function() {
            var widgetName = $(this).attr('name');
            toggleGuestUserSlider(widgetName, $('#id_guest_user_enabled').val());
        });

        // Attach an event listener to the dropdown to update the visibility and state dynamically
        $(document).on('change', '#id_guest_user_enabled', function() {
            var selectedValue = $(this).val();
            $('.slider-container').each(function() {
                var widgetName = $(this).find('input[type="checkbox"]').attr('name');
                toggleGuestUserSlider(widgetName, selectedValue);
            });
        });
    });
})(django.jQuery || jQuery);

</script>


<style>
.slider-container {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.slider-container input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: background-color 0.4s;
}

.switch:before {
  content: "";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: transform 0.4s;
}

input:checked + .switch {
  background-color: #2196F3;
}

input:checked + .switch:before {
  transform: translateX(26px);
}
</style>
