{% load static %}
{% load i18n %}
<!-- templates/admin/widgets/slider_checkbox.html -->

<div class="slider-container">
  <input type="checkbox" class="slider" id={{widget.name}} name="{{ widget.name }}" {% if widget.attrs.checked %}checked{% endif %}>
  <label for={{widget.name}} class="switch round"></label>
</div>

<style>
.slider-container {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.slider-container input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: background-color 0.4s;
}

.switch:before {
  content: "";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: transform 0.4s;
}

input:checked + .switch {
  background-color: #2196F3;
}

input:checked + .switch:before {
  transform: translateX(26px);
}
</style>
