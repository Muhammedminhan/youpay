SecretProviderClass:
- name: youpay-envs
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-eks-v2-youpay-app-role"
    objects: |
      - objectName: "application.env"
        secretPath: "ygag-secrets/data/ecommerce-web/qa/youpay/env-uae"
        secretKey: "app-env"

- name: youpay-certs-msk
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-eks-v2-youpay-app-role"
    objects: |
      - objectName: "aws-truststore.cert"
        secretPath: "ygag-secrets/data/ecommerce-web/qa/youpay/certs-msk"
        secretKey: "aws-truststore.cert"
      - objectName: "ca-cert.cert"
        secretPath: "ygag-secrets/data/ecommerce-web/qa/youpay/certs-msk"
        secretKey: "ca-cert.cert"
      - objectName: "ca-key.pem"
        secretPath: "ygag-secrets/data/ecommerce-web/qa/youpay/certs-msk"
        secretKey: "ca-key.pem"

