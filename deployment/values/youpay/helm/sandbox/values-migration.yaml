namespace: '<APPLICATION_NAME>'

app_name: '<APPLICATION_NAME>'

job:
  name: '<APPLICATION_NAME>-migration-job'
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 30
  serviceAccountName: '<PREFIX><APPLICATION_NAME>-vault'
  containers:
    - name: 'migration'
      imagePullPolicy: 'Always'
      image: '<ECR_REGISTRY>.dkr.ecr.<AWS_REGION>.amazonaws.com/<APP_IMAGE_REPOSITORY>:[BUILD_TAG]'
      command: '["sh", "-c", "source /vault/secrets/application.env ; python3.9 manage.py migrate --noinput >> /ygag/logs/app.out.migration.log 2>&1"]'
      memory:
        requests: 1000Mi
        limits: 1500Mi
      cpu:
        requests: 1000m
        limits: 1500m
      volumeMounts:
        - mountPath: '/ygag/logs/'
          name: '<PREFIX><APPLICATION_NAME>-sandbox-migration-logs'
        - name: '<APPLICATION_NAME>-app-env-volume'
          mountPath: "/vault/secrets"
        - name: '<APPLICATION_NAME>-certs-sample1-volume'
          mountPath: "/ygag/certs/sample1dir"
        - name: '<APPLICATION_NAME>-certs-sample2-volume'
          mountPath: "/ygag/certs/sample2dir"
        - name: '<APPLICATION_NAME>-certs-sample-client3-volume'
          mountPath: "/ygag/certs/sample-client3dir"

  volumes:
    - name: '<PREFIX><APPLICATION_NAME>-sandbox-migration-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/<PREFIX><APPLICATION_NAME>-sandbox/migration'
    - name: '<APPLICATION_NAME>-app-env-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-envs"
    - name: '<APPLICATION_NAME>-certs-sample1-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample1"
    - name: '<APPLICATION_NAME>-certs-sample2-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample2"
    - name: '<APPLICATION_NAME>-certs-sample-client3-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample-client3"

  nodeSelector:
    key: 'karpenter.sh/provisioner-name'
    value: 'default'
  priorityClassName: 'sandbox-critical'
  restartPolicy: 'Never'
  terminationGracePeriodSeconds: 120
