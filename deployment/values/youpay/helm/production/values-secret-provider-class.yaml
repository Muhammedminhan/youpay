SecretProviderClass:
- name: <APPLICATION_NAME>-envs
  namespace: <APPLICATION_NAME>
  provider: vault
  parameters:
    roleName: "<PREFIX>eks-v2-<APPLICATION_NAME>-app-role"
    objects: |
      - objectName: "application.env"
        secretPath: "ygag-secrets/data/<PRODUCT_TEAM>/production/<APPLICATION_NAME>/env"
        secretKey: "app-env"

- name: <APPLICATION_NAME>-certs-sample1
  namespace: <APPLICATION_NAME>
  provider: vault
  parameters:
    roleName: "<PREFIX>eks-v2-<APPLICATION_NAME>-app-role"
    objects: |
      - objectName: "certificate.pem"
        secretPath: "ygag-secrets/data/<PRODUCT_TEAM>/production/<APPLICATION_NAME>/certs-sample1"
        secretKey: "certificate.pem"
      - objectName: "private.key"
        secretPath: "ygag-secrets/data/<PRODUCT_TEAM>/production/<APPLICATION_NAME>/certs-sample1"
        secretKey: "private.key"

