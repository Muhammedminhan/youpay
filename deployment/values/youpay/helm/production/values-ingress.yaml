ingress:
  apiVersion: 'networking.k8s.io/v1'

  namespace: '<APPLICATION_NAME>'
  name: '<APPLICATION_NAME>-ingress'

  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/backend-protocol: 'HTTP'
    alb.ingress.kubernetes.io/certificate-arn: '[CERTIFICATE_ARN]'
    alb.ingress.kubernetes.io/group.name: 'default'
    alb.ingress.kubernetes.io/healthcheck-path: '<APP_HEALTH_FULL_PATH>'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/scheme: 'internet-facing'
    alb.ingress.kubernetes.io/tags: 'Name=<PREFIX>production-default-alb-eks<SUFFIX>, Platform=EKS, Environment=production'
    alb.ingress.kubernetes.io/wafv2-acl-arn: '[WAF_ARN]'
    alb.ingress.kubernetes.io/target-type: 'ip'
    alb.ingress.kubernetes.io/subnets: '<PREFIX>production-default-public-<AWS_REGION>a<SUFFIX>, <PREFIX>production-default-public-<AWS_REGION>b<SUFFIX>, <PREFIX>production-default-public-<AWS_REGION>c<SUFFIX>'
    alb.ingress.kubernetes.io/ssl-policy: 'ELBSecurityPolicy-TLS-1-2-2017-01'
    alb.ingress.kubernetes.io/load-balancer-attributes: 'access_logs.s3.enabled=true,access_logs.s3.bucket=[ALB_ACCESS_LOG_BUCKET],access_logs.s3.prefix=default-public,idle_timeout.timeout_seconds=120'
    kubernetes.io/ingress.class: 'alb'

  rules:
    - host: '[DOMAIN]'
      http:
        paths:
          - backend:
              service:
                name: '<APPLICATION_NAME>-nginx'
                port:
                  number: 80
            path: '/*'
            pathType: 'ImplementationSpecific'
