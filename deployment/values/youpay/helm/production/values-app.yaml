namespace: '<APPLICATION_NAME>'

app_name: '<APPLICATION_NAME>'
environment: 'production'

service:
  name: '<APPLICATION_NAME>-app'
  default:
    port: 8000
    protocol: 'TCP'
    targetPort: 8000

hpa:
  name: '<APPLICATION_NAME>-app-hpa'
  minReplicas: 5
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

pdb:
  name: '<APPLICATION_NAME>-app-pdb'
  minAvailable: 80%

deployment:
  name: '<APPLICATION_NAME>-app-deployment'
  replicas: 5
  maxSurge: 100%
  maxUnavailable: 0%
  serviceAccountName: 'ygag-<APPLICATION_NAME>-vault'

  containers:
    default:
      name: 'app'
      imagePullPolicy: 'Always'
      image: '<ECR_REGISTRY>.dkr.ecr.<AWS_REGION>.amazonaws.com/<APP_IMAGE_REPOSITORY>:[BUILD_TAG]'
      command: '["sh", "/ygag/deployment/app/app-entrypoint.sh"]'
      env:
        - name: 'DJANGO_SETTINGS_MODUL'
          value: 'DJANGO_SETTINGS_MODULE'
      port: 8000
      memory:
        requests: 400Mi
        limits: 500Mi
      cpu:
        requests: 100m
      health:
        path: '<APP_HEALTH_FULL_PATH>'
        port: 8000
        scheme: 'HTTP'
      startupProbe:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 7
      readinessProbe:
        initialDelaySeconds: 0
        periodSeconds: 15
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        initialDelaySeconds: 0
        periodSeconds: 15
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 4
      volumeMounts:
        - mountPath: '/ygag/logs/'
          name: '<PREFIX><APPLICATION_NAME>-production-app-logs'
        - name: '<APPLICATION_NAME>-app-env-volume'
          mountPath: "/vault/secrets"
        - name: '<APPLICATION_NAME>-certs-sample1-volume'
          mountPath: "/ygag/certs/sample1dir"
        - name: '<APPLICATION_NAME>-certs-sample2-volume'
          mountPath: "/ygag/certs/sample2dir"
        - name: '<APPLICATION_NAME>-certs-sample-client3-volume'
          mountPath: "/ygag/certs/sample-client3dir"

  volumes:
    - name: '<PREFIX><APPLICATION_NAME>-production-app-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/<PREFIX><APPLICATION_NAME>-production/app'
    - name: '<APPLICATION_NAME>-app-env-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-envs"
    - name: '<APPLICATION_NAME>-certs-sample1-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample1"
    - name: '<APPLICATION_NAME>-certs-sample2-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample2"
    - name: '<APPLICATION_NAME>-certs-sample-client3-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "<APPLICATION_NAME>-certs-sample-client3"

  nodeSelector:
    key: 'karpenter.sh/provisioner-name'
    value: 'default'

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: 'topology.kubernetes.io/zone'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: '<APPLICATION_NAME>'
          tier: app
    - maxSkew: 1
      topologyKey: 'kubernetes.io/hostname'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: '<APPLICATION_NAME>'
          tier: app

  priorityClassName: 'production-medium'
  terminationGracePeriodSeconds: 60
