namespace: '<APPLICATION_NAME>'

app_name: '<APPLICATION_NAME>'
environment: 'production'

service:
  name: '<APPLICATION_NAME>-nginx'
  default:
    port: 80
    protocol: 'TCP'
    targetPort: 80
  https:
    port: 443
    protocol: 'TCP'
    targetPort: 80

hpa:
  name: '<APPLICATION_NAME>-nginx-hpa'
  minReplicas: 5
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

pdb:
  name: '<APPLICATION_NAME>-nginx-pdb'
  minAvailable: 80%

deployment:
  name: '<APPLICATION_NAME>-nginx-deployment'
  replicas: 5
  maxSurge: 100%
  maxUnavailable: 0%

  containers:
    default:
      name: 'nginx'
      imagePullPolicy: 'Always'
      image: '<ECR_REGISTRY>.dkr.ecr.<AWS_REGION>.amazonaws.com/<NGINX_IMAGE_REPOSITORY>:[BUILD_TAG]'
      port: 80
      memory:
        requests: 32Mi
        limits: 64Mi
      cpu:
        requests: 10m
        limits: 100m
      health:
        path: '/nginx-health'
        port: 80
        scheme: 'HTTP'
      startupProbe:
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 5
      readinessProbe:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 4

  volumes:
    local:
      - name: '<PREFIX><APPLICATION_NAME>-production-nginx-logs'
        mountPath: '/var/log/nginx/'
        hostPath: '/home/ec2-user/ygag-logs/<PREFIX><APPLICATION_NAME>-production/nginx'

  nodeSelector:
    key: 'karpenter.sh/provisioner-name'
    value: 'default'

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: 'topology.kubernetes.io/zone'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: '<APPLICATION_NAME>'
          tier: nginx
    - maxSkew: 1
      topologyKey: 'kubernetes.io/hostname'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: '<APPLICATION_NAME>'
          tier: nginx

  priorityClassName: 'production-medium'
  terminationGracePeriodSeconds: 100
