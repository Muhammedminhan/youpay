namespace: 'youpay'

app_name: 'youpay'
environment: 'production'
type: 'consumer-name'

service:
  name: 'youpay-consumer-name'
  default:
    port: 8000
    protocol: 'TCP'
    targetPort: 8000

hpa:
  name: 'youpay-consumer-name-hpa'
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

pdb:
  name: 'youpay-consumer-name-pdb'
  minAvailable: 50%

deployment:
  name: 'youpay-consumer-name-deployment'
  replicas: 1
  maxSurge: 100%
  maxUnavailable: 0%
  serviceAccountName: 'ygag-youpay-vault'

  containers:
    default:
      name: 'consumer-name'
      imagePullPolicy: 'Always'
      image: '459037613883.dkr.ecr.ap-south-1.amazonaws.com/production/ygag/youpay/backend-app:[BUILD_TAG]'
      command: '["sh", "-c", "source /vault/secrets/application.env ; python3.9 manage.py consumer >> /ygag/logs/app.out.consumer-name.log 2>&1"]'
      memory:
        requests: 300Mi
        limits: 400Mi
      cpu:
        requests: 100m
      volumeMounts:
        - mountPath: '/ygag/logs/'
          name: 'ygag-youpay-production-consumer-name-logs'
        - name: 'youpay-app-env-volume'
          mountPath: "/vault/secrets"
        - name: 'youpay-certs-sample1-volume'
          mountPath: "/ygag/certs/sample1dir"
        - name: 'youpay-certs-sample2-volume'
          mountPath: "/ygag/certs/sample2dir"
        - name: 'youpay-certs-sample-client3-volume'
          mountPath: "/ygag/certs/sample-client3dir"

  volumes:
    - name: 'ygag-youpay-production-consumer-name-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/ygag-youpay-production/consumer'
    - name: 'youpay-app-env-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-envs"
    - name: 'youpay-certs-sample1-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-sample1"
    - name: 'youpay-certs-sample2-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-sample2"
    - name: 'youpay-certs-sample-client3-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-sample-client3"

  nodeSelector:
    key: 'karpenter.sh/provisioner-name'
    value: 'default'

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: 'topology.kubernetes.io/zone'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay'
          tier: consumer-name
    - maxSkew: 1
      topologyKey: 'karpenter.sh/capacity-type'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay'
          tier: consumer-name

  priorityClassName: 'production-medium'
  terminationGracePeriodSeconds: 60
