SecretProviderClass:
- name: youpay-envs
  namespace: youpay
  provider: vault
  parameters:
    roleName: "ygag-eks-v2-youpay-app-role"
    objects: |
      - objectName: "application.env"
        secretPath: "ygag-secrets/data/youpay/production/youpay/env-v2"
        secretKey: "app-env"

- name: youpay-certs-applepay
  namespace: youpay
  provider: vault
  parameters:
    roleName: "ygag-eks-v2-youpay-app-role"
    objects: |
      - objectName: "cert.crt"
        secretPath: "ygag-secrets/data/youpay/production/youpay/certs-applepay"
        secretKey: "cert.crt"
      - objectName: "key.pem"
        secretPath: "ygag-secrets/data/youpay/production/youpay/certs-applepay"
        secretKey: "key.pem"

- name: youpay-certs-visa-ctp
  namespace: youpay
  provider: vault
  parameters:
    roleName: "ygag-eks-v2-youpay-app-role"
    objects: |
      - objectName: "private_key.pem"
        secretPath: "ygag-secrets/data/youpay/production/youpay/certs-visa-ctp"
        secretKey: "private_key.pem"
