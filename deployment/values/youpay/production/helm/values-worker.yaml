namespace: 'youpay'

app_name: 'youpay'
environment: 'production'

service:
  name: 'youpay-worker'
  default:
    port: 8000
    protocol: 'TCP'
    targetPort: 8000

hpa:
  name: 'youpay-worker-hpa'
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

pdb:
  name: 'youpay-worker-pdb'
  minAvailable: 50%

deployment:
  name: 'youpay-worker-deployment'
  replicas: 1
  maxSurge: 100%
  maxUnavailable: 0%
  serviceAccountName: 'ygag-youpay-vault'

  containers:
    default:
      name: 'worker'
      imagePullPolicy: 'Always'
      image: '459037613883.dkr.ecr.ap-south-1.amazonaws.com/production/ygag/youpay/backend-app:[BUILD_TAG]'
      command: '["sh", "-c", "source /vault/secrets/application.env ; sh /ygag/deployment/app/worker-entrypoint.sh"]'
      memory:
        requests: 300Mi
        limits: 400Mi
      cpu:
        requests: 150m
      volumeMounts:
        - mountPath: /ygag/logs/
          name: 'ygag-youpay-production-worker-logs'
        - name: 'youpay-app-env-volume'
          mountPath: "/vault/secrets"
        - name: 'youpay-certs-applepay-volume'
          mountPath: "/ygag/certs/applepay"

  volumes:
    - name: 'ygag-youpay-production-worker-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/ygag-youpay-production/worker'
    - name: 'youpay-app-env-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-envs"
    - name: 'youpay-certs-applepay-volume'
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-applepay"

  nodeSelector:
    key: 'karpenter.sh/provisioner-name'
    value: 'default'

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: 'topology.kubernetes.io/zone'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay'
          tier: worker
    - maxSkew: 1
      topologyKey: 'karpenter.sh/capacity-type'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay'
          tier: worker

  priorityClassName: 'production-medium'
  terminationGracePeriodSeconds: 60
