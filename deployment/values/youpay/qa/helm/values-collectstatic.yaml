namespace: 'youpay-[JIRA_ID]'

app_name: 'youpay-[JIRA_ID]'

job:
  name: 'youpay-[JIRA_ID]-collectstatic-job'
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 30
  serviceAccountName: ygag-youpay-vault

  containers:
    - name: 'collectstatic'
      imagePullPolicy: 'IfNotPresent'
      image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/ygg/youpay/backend-app:[BUILD_TAG]'
      command: '["sh", "-c", "/bin/cp -f /vault/secrets/application.env /etc/profile.d/application-env.sh ; sed -i \"s/\\[JIRA_ID\\]/[JIRA_ID]/g\" /etc/profile.d/application-env.sh ; source /etc/profile.d/application-env.sh ; python3 manage.py collectstatic --no-input >> /ygag/logs/app.out.collectstatic.log 2>&1"]'
      memory:
        requests: 1000Mi
        limits: 1500Mi
      cpu:
        requests: 1000m
        limits: 1500m
      volumeMounts:
        - mountPath: '/ygag/logs/'
          name: 'ygag-youpay-[JIRA_ID]-qa-collectstatic-logs'
        - name: youpay-app-env-volume
          mountPath: "/vault/secrets"
        - name: 'youpay-certs-applepay-volume'
          mountPath: "/ygag/certs/applepay/sandbox"

  volumes:
    - name: 'ygag-youpay-[JIRA_ID]-qa-collectstatic-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/ygag-youpay-[JIRA_ID]-qa/collectstatic'
    - name: youpay-app-env-volume
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-envs"
    - name: youpay-certs-applepay-volume
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-applepay"

  initContainers:
    database:
      - image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/postgres:16.6'
        cmd: 'pg_isready -p 5432'
        host: 'youpay-[JIRA_ID]-database'
        name: 'init-database'
    redis:
      - image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/redis:6.2.4'
        host: 'youpay-[JIRA_ID]-redis'
        name: 'init-redis'

  nodeSelector:
    key: 'karpenter.sh/nodepool'
    value: 'default'
  priorityClassName: 'qa-medium'
  restartPolicy: 'Never'
  terminationGracePeriodSeconds: 120

