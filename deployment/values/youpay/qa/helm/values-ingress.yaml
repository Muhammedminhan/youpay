ingress:
  apiVersion: 'networking.k8s.io/v1'

  namespace: 'youpay-[JIRA_ID]'
  name: 'youpay-[JIRA_ID]-ingress'

  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/backend-protocol: 'HTTP'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-2:420360167813:certificate/d66b244f-2d25-4d65-9715-7ccc538b5293'
    alb.ingress.kubernetes.io/group.name: 'default'
    alb.ingress.kubernetes.io/healthcheck-path: '/health/'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/scheme: 'internet-facing'
    alb.ingress.kubernetes.io/tags: 'Name=ygag-qa-default-alb-eks-tf, Platform=EKS, Environment=qa'
    alb.ingress.kubernetes.io/wafv2-acl-arn: 'arn:aws:wafv2:us-east-2:420360167813:regional/webacl/AWSRegionalWAF2/26f46ac5-70f1-402c-b5bb-9d0ff2f8553c'
    alb.ingress.kubernetes.io/target-type: 'ip'
    alb.ingress.kubernetes.io/subnets: 'ygag-qa-default-public-us-east-2a-tf, ygag-qa-default-public-us-east-2b-tf, ygag-qa-default-public-us-east-2c-tf'
    alb.ingress.kubernetes.io/load-balancer-attributes: 'idle_timeout.timeout_seconds=120'
    kubernetes.io/ingress.class: 'alb'

  rules:
    - host: 'youpay-[JIRA_ID].sit.yougotagift.co'
      http:
        paths:
          - backend:
              service:
                name: 'youpay-[JIRA_ID]-nginx'
                port:
                  number: 80
            path: '/*'
            pathType: 'ImplementationSpecific'

