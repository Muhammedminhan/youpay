namespace: 'youpay-[JIRA_ID]'

app_name: 'youpay-[JIRA_ID]'
environment: 'qa'

service:
  name: 'youpay-[JIRA_ID]-cron'
  default:
    port: 8000
    protocol: 'TCP'
    targetPort: 8000

enableHPA: false
hpa:
  name: 'youpay-[JIRA_ID]-cron-hpa'
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

enableKedaCron: true
keda:
  name: 'youpay-[JIRA_ID]-cron-keda'
  minReplicas: 0
  desiredReplicas: 1
  maxReplicas: 1
  start: "0 7 * * 1-5"
  end: "0 22 * * 1-5"
  cpu: 80

pdb:
  name: 'youpay-[JIRA_ID]-cron-pdb'
  minAvailable: 0%

deployment:
  name: 'youpay-[JIRA_ID]-cron-deployment'
  replicas: 1
  maxSurge: 100%
  maxUnavailable: 0
  serviceAccountName: ygag-youpay-vault

  containers:
    default:
      name: 'cron'
      imagePullPolicy: 'IfNotPresent'
      image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/ygg/youpay/backend-app:[BUILD_TAG]'
      command: '["sh", "-c", "/bin/cp -f /vault/secrets/application.env /etc/profile.d/application-env.sh ; sed -i \"s/\\[JIRA_ID\\]/[JIRA_ID]/g\" /etc/profile.d/application-env.sh ; source /etc/profile.d/application-env.sh ; sh /ygag/deployment/app/cron-entrypoint.sh"]'
      memory:
        requests: 125Mi
        limits: 162Mi
      cpu:
        requests: 40m
      volumeMounts:
        - mountPath: /ygag/logs/
          name: ygag-youpay-[JIRA_ID]-qa-cron-logs
        - name: youpay-app-env-volume
          mountPath: "/vault/secrets"
        - name: 'youpay-certs-applepay-volume'
          mountPath: "/ygag/certs/applepay/sandbox"

  volumes:
    - name: 'ygag-youpay-[JIRA_ID]-qa-cron-logs'
      hostPath:
        path: '/home/ec2-user/ygag-logs/ygag-youpay-[JIRA_ID]-qa/cron'
    - name: youpay-app-env-volume
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-envs"
    - name: youpay-certs-applepay-volume
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "youpay-certs-applepay"

  initContainers:
    database:
      - image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/postgres:16.6'
        cmd: 'pg_isready -p 5432'
        host: 'youpay-[JIRA_ID]-database'
        name: 'init-database'
    redis:
      - image: '420360167813.dkr.ecr.ap-south-1.amazonaws.com/qa/redis:6.2.4'
        host: 'youpay-[JIRA_ID]-redis'
        name: 'init-redis'

  nodeSelector:
    key: 'karpenter.sh/nodepool'
    value: 'default'

  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: 'topology.kubernetes.io/zone'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay-[JIRA_ID]'
          tier: cron
    - maxSkew: 2
      topologyKey: 'kubernetes.io/hostname'
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: 'youpay-[JIRA_ID]'
          tier: cron

  priorityClassName: 'qa-medium'
  terminationGracePeriodSeconds: 60

