        secretKey: "certificate.pem"
      - objectName: "private.key"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample2"
        secretKey: "private.key"
      - objectName: "private2.key"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample2"
        secretKey: "private2.key"
      - objectName: "private3.key"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample2"
        secretKey: "private3.key"
      - objectName: "private4.key"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample2"
