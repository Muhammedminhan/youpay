SecretProviderClass:
- name: youpay-envs
  namespace: youpay
  provider: vault
  parameters:
    roleName: "ygag-eks-v2-youpay-app-role"
    objects: |
      - objectName: "application.env"
        secretPath: "ygag-secrets/data/payment/qa/youpay/env"
        secretKey: "app-env"

- name: youpay-certs-sample1
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-qa-eks-youpay-app-role"
    objects: |
      - objectName: "certificate.pem"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample1"
        secretKey: "certificate.pem"
      - objectName: "private.key"
        secretPath: "ygag-secrets/data/payment/qa/youpay/certs-sample1"
        secretKey: "private.key"

