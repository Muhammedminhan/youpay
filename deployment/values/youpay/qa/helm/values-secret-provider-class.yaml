SecretProviderClass:
- name: youpay-envs
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-eks-v2-youpay-app-role"
    objects: |
      - objectName: "application.env"
        secretPath: "ygag-secrets/data/youpay/qa/youpay/env-v2"
        secretKey: "app-env"

- name: youpay-certs-applepay
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-eks-v2-youpay-app-role"
    objects: |
      - objectName: "certificate_sandbox.key"
        secretPath: "ygag-secrets/data/youpay/qa/youpay/certs-applepay/sandbox"
        secretKey: "certificate_sandbox.key"
      - objectName: "certificate_sandbox.pem"
        secretPath: "ygag-secrets/data/youpay/qa/youpay/certs-applepay/sandbox"
        secretKey: "certificate_sandbox.pem"

- name: youpay-certs-visa-ctp
  namespace: youpay-[JIRA_ID]
  provider: vault
  parameters:
    roleName: "ygg-eks-v2-youpay-app-role"
    objects: |
      - objectName: "private_key.pem"
        secretPath: "ygag-secrets/data/youpay/qa/youpay/certs-visa-ctp"
        secretKey: "private_key.pem"
