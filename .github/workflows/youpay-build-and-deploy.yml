name: Build & Deploy youpay
run-name: Deploying ${{ inputs.application_name }} ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: 'application_name'
        required: true
        type: string
        default: 'youpay'
      rebuild_req:
        description: 'Force reinstall requirement'
        required: true
        default: 'false'
        type: choice
        options:
          - false
          - true
      environment:
        description: 'Environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
        - sandbox
        - production
      branch:
        description: 'Branch'
        type: string
      prod_hotfix_branch:
        description: 'Deploy Production with hot-fix branch'
        default: false
        type: boolean


jobs:
  deploy:
    name: ${{ inputs.application_name }}
    uses: YouGotaGift/devops-organization-actions/.github/workflows/ap-south-1-application-build-and-deploy.yml@main
    with:
      application_name: ${{ inputs.application_name }}
      rebuild_req: ${{ inputs.rebuild_req }}
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      prod_hotfix_branch: ${{ inputs.prod_hotfix_branch }}
    secrets: inherit
